<!DOCTYPE html>
<html>
    <!-- 
        // Copyright 2024-26 Brad Hutchings. 
        // All Rights Reserved.
        // License Inquiries: brad@BradHutchings.com.
    -->
<head>
    <link rel="manifest" href="mmojo-complete-manifest.json" />
    <link rel="icon" href="images/logo-128.png" />

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>

    <title>Mmojo Complete</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, interactive-widget=resizes-content" />
</head>
<body onload="PageLoaded();" onresize="PageResized();" onbeforeprint="LoadPrint();" onhashchange="HashChange();" onclick="WorkAreaFocus();">
    <!--
    
    -->
    <div id="print-layout">
        <img id="print-picture" />

        <div id="print-content">
            Here is some content to print!
        </div>
    </div>

    <div id="content" onclick="WorkAreaFocus();">

        <div id="title-bar" class="row">
            <div id="mmojo-complete" onclick="WorkAreaFocus();">Mmojo Complete is Private.</div>
            <div id="settings-icon" onclick="IconClickedSettings(event);" title="Toggle Settings" ></div>
            <div id="tools-icon" onclick="IconClickedTools(event);" title="Toggle Tools" ></div>
            <div id="files-icon" class="hidden" onclick="IconClickedFiles(event);" title="Toggle Files" ></div>
            <div id="help-icon" onclick="IconClickedHelp(event);" title="Help" ></div>
        </div>

        <div id="tools-area" class="row hidden" onclick="WorkAreaFocus();">
            <!--
            <div id="tools-info" class="row-item" onclick="WorkAreaFocus();">
            -->
                <label id="model-label">Model:</label>
                <div id="model"></div>
                <div id="updated-space" class="space"></div>
                <label id="updated-label" class="hidden">Mmojo Server:</label>
                <div id="updated" class="hidden">Date</div>

            <!--
            </div>
            <div id="tools" class="row" onclick="WorkAreaFocus();">
            -->
                <!--
                <div id="chat-icon" onclick="Chat(event);" title="Mmojo Chat" ></div>
                -->
                <div id="read-icon" onclick="Read(event)" title="Read Work Area" ></div>
                <div id="download-icon" onclick="Download(event)" title="Download Work Area" ></div>
                <div id="print-icon" onclick="IconClickedPrint(event);" title="Print Work Area" ></div>
                <div id="bookmark-icon" onclick="IconClickedBookmark(event);" title="Bookmark Maker" ></div>
                <div id="fullscreen-icon" onclick="IconClickedFullScreen(event);" title="Full Screen" ></div>
                <div id="restore-icon" class="hidden" onclick="IconClickedRestore(event);" title="Exit Full Screen" ></div>
            <!--
            </div>
            -->
        </div>

        <div id="settings" class="row hidden" onclick="WorkAreaFocus();">
            <label id="theme-label" for="theme">Theme:</label>
            <select id="theme" onclick="EnableControls(event);" onchange="ThemeChanged(event);" >
                <option value="peach-olive" selected>Peach Olive</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>

            <div id="copy-paste-divider" class="vertical-divider"></div>
            <label class="checkbox-container" id="show-copy-and-paste-checkbox-label">Show Copy &amp; Paste
                <input type="checkbox" id="show-copy-and-paste-checkbox" onclick="EnableControls(event);" onchange="ShowCopyAndPasteChanged(event);">
                <span class="checkbox-checkmark"></span>
            </label>
            <div id="settings-break-1" class="break"></div>

            <label id="temperature-label" for="temperature">Temperature:</label>
            <select id="temperature" onclick="EnableControls(event);">
                <option value="0.00">0.00</option>
                <option value="0.10">0.10</option>
                <option value="0.25" selected>0.25</option>
                <option value="0.50">0.50</option>
                <option value="0.75">0.75</option>
                <option value="0.90">0.90</option>
                <option value="1.00">1.00</option>
            </select>

            <div id="tokens-divider" class="vertical-divider"></div>
            <label id="tokens-label" for="tokens">Tokens:</label>
            <select id="tokens" onclick="EnableControls(event);">
                <option value="-1" selected>Complete</option>
                <option value="1">1</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
                <option value="5000">5000</option>
                <option value="10000">10,000</option>
            </select>

            <div id="stop-words-divider" class="vertical-divider"></div>
            <label class="checkbox-container" id="stop-words-checkbox-label">Stop Words
                <input type="checkbox" id="stop-words-checkbox" onclick="EnableControls(event);" onchange="StopWordsSetFocus(event);">
                <span class="checkbox-checkmark"></span>
            </label>
            
            <div id="stop-words-break" class="break hidden"></div>
            <label id="stop-words-label" for="stop-words" class="hidden">Stop Words:</label>
            <input id="stop-words" type="text" class="hidden" onclick="EnableControls(event);" />

            <div id="settings-break-2" class="break hidden"></div>
            <label id="api-key-label" class="hidden" for="api-key">API Key:</label>
            <input id="api-key" class="hidden" type="text" onclick="EnableControls(event);" onkeyup="APIKeyChanged(event);" onchange="APIKeyChanged(event);" />

        </div>

        <div id="print" class="row hidden" onclick="WorkAreaFocus();">
            <label id="print-size-label" for="print-size">Print Size:</label>
            <select id="print-size" onclick="EnableControls(event);">
                <option value="1rem">Tiny</option>
                <option value="1.2rem">Small</option>
                <option value="1.4rem" selected>Medium</option>
                <option value="1.6rem">Large</option>
                <option value="1.8rem">Huge</option>
            </select>
            <div id="picture-width-divider" class="vertical-divider"></div>
            <label id="picture-width-label" for="picture-width">Picture Width:</label>
            <select id="picture-width" onclick="EnableControls(event);">
                <option value="10%">10%</option>
                <option value="15%">15%</option>
                <option value="20%">20%</option>
                <option value="25%" selected>25%</option>
                <option value="30%">30%</option>
                <option value="35%">35%</option>
                <option value="40%">40%</option>
                <option value="45%">45%</option>
                <option value="50%">50%</option>
            </select>

            <div id="print-space" class="space"></div>
            <button id="print-print-button" onclick="Print(event);">Print</button>
            <button id="print-cancel-button" onclick="TogglePrintSettings(event);">Cancel</button>

            <div id="picture-url-break" class="break"></div>
            <label id="picture-url-label" for="picture-url">Picture URL:</label>
            <input id="picture-url" type="text" onclick="EnableControls(event);" onchange="UpdatePicture();"/>
        </div>

        <div id="work-area" class="row">
            <textarea id="work-area-text" class="row-item editing" disabled onkeydown="WorkAreaTextKeyDown(event);" 
                onclick="WorkAreaTextClicked(event);" onpaste="WorkAreaTextPaste(event);"
                ondrop="ShowHideStatusButtons();"
                placeholder=""></textarea>

            <div id="copy-paste" class="row-item" >
                <div id="copy-paste-item" class="copy-paste-item">
                    <button class="copy-paste-button">Copy</button><br/>
                    <button class="remove-button hidden">Remove</button>
                </div>

                <div id="copy-paste-space" class="space"></div>
                <button id="clear-cue" class="clear-button hidden" onclick="WorkAreaFocus(); ClearCue();">Clear Cue</button>
            </div>
        </div>

        <div id="help-container" class="row hidden editing">
            <div id="help-text"></div>
        </div>

        <div id="files-area" class="row hidden">
            <div id="files-directory" class="row">
                <div id="files-directory-name"><b>Directory:</b> Directory is not implemented yet.</div>
                <button id="files-directory-choose" onclick="FilesDirectoryChoose();">Choose</button>
                <button id="files-download-all" onclick="FilesDownloadAll();">Download All</button>
            </div>
            <div id="files-area-body" class="row">
                <div id="files-list" class="row-item" onclick="FilesListDeselect(event);">
                    <div id="files-list-item-template" class="files-list-item x-hidden" onclick="FilesListItemClicked(event);" ondblclick="FilesListItemDoubleClicked(event);">
                        <div class="files-list-item-name">(file name)</div>
                        <div class="files-list-item-code-type">(code type)</div>
                        <div class="files-list-item-snippet">(snippet)</div>
                    </div>
                </div>
                <div id="file-view" class="row-item">
                    <div id="file-view-header" class="row">
                        <div id="file-name"><b>Filename:</b> File name goes here.</div>
                        <button id="file-copy" onclick="FileCopy();">Copy</button>
                        <button id="file-download" onclick="FileDownload();">Download</button>
                        <!--
                        <button id="file-save-as" onclick="FileSaveAs();">Save As...</button>
                        -->
                   </div>
                    <textarea id="file-contents" class="row" placeholder="" readonly="readonly"></textarea>
                </div>
            </div>
        </div>

        <div id="bookmark-maker" class="row hidden">
            <div id="bookmark-settings" class="row" ondrop="BookmarkOnDrop(event);" ondragover="BookmarkOnDragOver(event);" >
                <label for="bookmark-label">Label:</label>
                <input id="bookmark-label" type="text" oninput="UpdateBookmark();" />
                <div id="bookmark-label-space" class="space"></div>
    
                <label id="bookmark-link-label">Bookmark:</label>
                <a id="bookmark-link" href="/#"></a>
    
                <div id="bookmark-temperature-break" class="break"></div>
                <label for="bookmark-temperature">Temperature:</label>
                <select id="bookmark-temperature" onchange="UpdateBookmark();">
                    <option value="" selected></option>
                    <option value="0.00">0.00</option>
                    <option value="0.10">0.10</option>
                    <option value="0.25">0.25</option>
                    <option value="0.50">0.50</option>
                    <option value="0.75">0.75</option>
                    <option value="0.90">0.90</option>
                    <option value="1.00">1.00</option>
                </select>
                <div class="vertical-divider"></div>
                <label for="bookmark-tokens">Tokens:</label>
                <select id="bookmark-tokens" onchange="UpdateBookmark();">
                    <option value="" selected></option>
                    <option value="-1">Complete</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                    <option value="5000">5000</option>
                    <option value="10000">10,000</option>
                </select>
            
                <div id="bookmark-stop-words-break" class="break"></div>
                <label class="checkbox-container" id="bookmark-stop-words-checkbox-label">Stop Words
                    <input type="checkbox" id="bookmark-stop-words-checkbox" onclick="EnableControls(event);" onchange="StopWordsSetFocus(event);">
                    <span class="checkbox-checkmark"></span>
                </label>
                <!--
                <input id="bookmark-stop-words-checkbox" type="checkbox" onchange="UpdateBookmark();"/>
                <label for="bookmark-stop-words-checkbox">Stop Words</label>
                -->
                <div class="vertical-divider"></div>
                <label for="bookmark-stop-words">Stop Words</label>
                <input id="bookmark-stop-words" type="text" oninput="UpdateBookmark();"/>
    
                <div id="bookmark-mode-break" class="break"></div>
                <label for="bookmark-mode">Mode:</label>
                <select id="bookmark-mode" onchange="UpdateBookmark();">
                    <option value="cue-link" selected>Cue (Link)</option>
                    <option value="cue-script">Cue (Script)</option>
                    <option value="append">Append</option>
                    <option value="prepend">Prepend</option>
                    <option value="replace">Replace</option>
                    <option value="replace-regex">Replace (RegEx)</option>
                </select>
    
                <div class="vertical-divider"></div>
                <label class="checkbox-container" id="bookmark-auto-complete-checkbox-label">Auto-Complete
                    <input type="checkbox" id="bookmark-auto-complete-checkbox" onclick="EnableControls(event);" onchange="StopWordsSetFocus(event);">
                    <span class="checkbox-checkmark"></span>
                </label>
                <!--
                <input id="bookmark-auto-complete-checkbox" type="checkbox" onchange="UpdateBookmark();"/>
                <label for="bookmark-auto-complete-checkbox">Auto-Complete</label>
                -->
    
                <div id="bookmark-clear-space" class="space"></div>
                <button id="bookmark-clear" class="clear-button" onclick="ClearBookmarkMaker();">Clear</button>
            </div>
    
            <div id="bookmark-cue" class="row">
                <textarea id="bookmark-cue-text" class="row-item" onkeydown="BookmarkTextChanged();"
                    placeholder=""></textarea>
                </div>
    
            <div id="bookmark-completed" class="row">
                <textarea id="bookmark-completed-text" class="row-item"  onkeydown="BookmarkTextChanged();"
                    placeholder=""></textarea>
    
            </div>    
        </div>
        
        <div id="status" class="row hidden" onclick="WorkAreaFocus();">
            <div id="status-text"><b>Status:</b> The status goes here.</div>
            <div id="status-space" class="space"></div>
            <button id="status-start" onclick="StatusStartClicked();">Start</button>
            <button id="status-stop" onclick="StatusStopClicked();">Stop</button>
            <button id="status-undo" onclick="StatusUndoClicked();">Undo</button>
            <button id="status-clear" onclick="StatusClearClicked();">Clear</button>
        </div>

        <div id="gutter" class="row">
            <div id="link"><b>Mmojo.net</b></div>
            <div id="gutter-space" class="space"></div>
            <div id="copyright">&copy;2024-26 Brad Hutchings. All rights reserved.</div>
        </div>

        <div id="preview" class="hidden"></div>
    </div>
</body>
</html>
