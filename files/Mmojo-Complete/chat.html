<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmojo Chat is private.</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --chat-bg: #252538;
            --text-color: #cdd6f4;
            --user-msg: #89b4fa;
            --user-text: #11111b;
            --bot-msg: #45475a;
            --input-bg: #313244;
            --button-bg: #a6e3a1;
            --button-text: #11111b;
        }

        header {
            background-color: var(--chat-bg);
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid var(--input-bg);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user {
            background-color: var(--user-msg);
            color: var(--user-text);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot {
            background-color: var(--bot-msg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        #input-container {
            background-color: var(--chat-bg);
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--input-bg);
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            color: white;
            border: 1px solid #585b70;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 24px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 1px solid var(--user-msg);
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--bot-msg);
            color: #7f849c;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>Mmojo Chat is private.</header>
    
    <main id="chat-container"></main>

    <div id="input-container">
        <textarea id="user-input" placeholder="Type your message here... (Press Enter to send)"></textarea>
        <button id="send-button" onclick="sendMessage()">Send</button>
        <button id="clear-button" onclick="clearChat()">Clear</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');
        
        // Store conversation context history
        let conversationHistory = [];

        // Auto-expand textarea slightly as user types
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight - 20) + 'px';
        });

        // Enter key to send message
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function clearChat() {
            console.log("clearing.");
            chatContainer.innerHTML = "";
            conversationHistory = [];
        }

        function appendMessage(text, sender) {
            console.log("appending message.");
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            console.log("sending message.");
            const text = userInput.value.trim();
            if (!text) return;

            // Clear input field reset height
            userInput.value = '';
            userInput.style.height = '24px';
            
            // Append User Message to UI & Context History
            appendMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });

            // Lock Input elements
            userInput.disabled = true;
            sendButton.disabled = true;
            clearButton.disabled = true;

            // Setup placeholder element for streamed Bot response
            const botMessageElement = appendMessage("", 'bot');

            const apiUrl = "/v1/chat/completions";

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: conversationHistory,
                        stream: true // Enable Server-Sent Events (Streaming Tokens)
                    })
                });

                if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);

                // Read streamed response body chunks
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let botReplyAccumulator = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        const cleanedLine = line.replace(/^data: /, '').trim();
                        if (!cleanedLine || cleanedLine === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(cleanedLine);
                            const token = parsed.choices[0].delta.content;
                            if (token) {
                                botReplyAccumulator += token;
                                botMessageElement.textContent = botReplyAccumulator;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        } catch (e) {
                            // Suppress parsing anomalies on partial data chunks
                        }
                    }
                }

                // Add complete assistant message to context memory history 
                conversationHistory.push({ role: "assistant", content: botReplyAccumulator });

            } catch (error) {
                console.error(error);
                botMessageElement.textContent = `Error connecting to API. Make sure your local server is running and CORS is enabled. Details: ${error.message}`;
                botMessageElement.style.color = "#f38ba8";
            } finally {
                // Re-enable interactive elements
                userInput.disabled = false;
                sendButton.disabled = false;
                clearButton.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
